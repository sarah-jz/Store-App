<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="p-4">

<h1 class="mb-4">📊 Analytics Dashboard</h1>

<!-- KPI CARDS -->
<div class="row mb-4">

    <div class="col-md-6">
        <div class="card text-white bg-primary shadow">
            <div class="card-body">
                <h5>Total Inventory Value</h5>
                <h2>${{ total_value }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card text-white bg-success shadow">
            <div class="card-body">
                <h5>Total Items in Stock</h5>
                <h2>{{ total_items }}</h2>
            </div>
        </div>
    </div>

</div>

<!-- STOCK CHART (OPTIONAL - ONLY IF YOU PASS products) -->
<div class="card p-3 shadow mb-4">
    <h4>📦 Product Stock Levels</h4>
    <canvas id="stockChart"></canvas>
</div>
<script>
const stockCtx = document.getElementById('stockChart');

new Chart(stockCtx, {
    type: 'bar',
    data: {
        labels: [
            {% for p in products %}
                "{{ p[0] }}"{% if not loop.last %},{% endif %}
            {% endfor %}
        ],
        datasets: [{
            label: 'Stock Quantity',
            data: [
                {% for p in products %}
                    {{ p[1] }}{% if not loop.last %},{% endif %}
                {% endfor %}
            ],
            backgroundColor: 'rgba(255, 159, 64, 0.7)',
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        animation: {
            duration: 1200,
            easing: 'easeOutBounce'
        },
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

<!-- SALES CHART -->
<div class="card p-3 shadow mb-4">
    <h4>📈 Daily Revenue</h4>
    <canvas id="salesChart"></canvas>
</div>

<script>
/* ---------------- SALES CHART ---------------- */
const salesCtx = document.getElementById('salesChart');

new Chart(salesCtx, {
    type: 'line',
    data: {
        labels: [
            {% for s in sales %}
                "{{ s[0] }}"{% if not loop.last %},{% endif %}
            {% endfor %}
        ],
        datasets: [{
            label: 'Revenue',
            data: [
                {% for s in sales %}
                    {{ s[1] }}{% if not loop.last %},{% endif %}
                {% endfor %}
            ],
            borderColor: 'blue',
            tension: 0.3
        }]
    },
    options: {
        responsive: true,
        animation: {
            duration: 1200
        }
    }
});
</script>

</body>
</html>
