<!DOCTYPE html>
<html>
<head>
    <title>Sales Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h1>📈 Sales Dashboard</h1>

    <div class="row mt-4">

        <div class="col-md-6">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5>Total Revenue</h5>
                    <h2>₹{{ total_revenue }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5>Total Orders</h5>
                    <h2>{{ total_orders }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card mt-4">

        <div class="card-header">
            🏆 Top Selling Products
        </div>

        <div class="card-body">

            <table class="table">

                <tr>
                    <th>Product</th>
                    <th>Units Sold</th>
                </tr>

                {% for product in top_products %}
                <tr>
                    <td>{{ product[0] }}</td>
                    <td>{{ product[1] }}</td>
                </tr>
                {% endfor %}

            </table>

        </div>

    </div>

</div>

</body>
</html>
