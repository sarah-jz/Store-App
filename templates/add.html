<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            max-width: 600px;
            margin: auto;
            margin-top: 40px;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="card shadow">

    <h3 class="mb-3">➕ Add Product</h3>

    <form method="POST" action="/add_product" enctype="multipart/form-data">

        <div class="mb-2">
            <label>Code</label>
            <input type="number" name="pcode" class="form-control" required>
        </div>

        <div class="mb-2">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-2">
            <label>Qty</label>
            <input type="number" name="quantity" class="form-control" required>
        </div>

        <div class="mb-2">
            <label>Price</label>
            <input type="number" name="price" class="form-control" required>
        </div>

        <div class="mb-2">
            <label>Description</label>
            <textarea name="description" class="form-control" required></textarea>
        </div>

        <div class="mb-3">
            <label>Product Image</label>
            <input type="file" name="image" class="form-control">
        </div>

        <button class="btn btn-success w-100">
            Add Product
        </button>

    </form>

    <div class="d-flex justify-content-between mt-3">

        <a href="/analytics" class="btn btn-primary btn-sm">View Analytics</a>

        <a href="/shop" class="btn btn-warning btn-sm">Go to Shop</a>

        <a href="/admin" class="btn btn-secondary btn-sm">Back</a>

    </div>

</div>

</body>
</html>
