<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .cart-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <h2>🛒 Your Cart</h2>

    <div class="cart-box mt-3">

        <table class="table table-striped">

            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total</th>
            </tr>

            {% for item in cart %}
            <tr>
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>{{ item[2] }}</td>
                <td>{{ item[1] * item[2] }}</td>
            </tr>
            {% endfor %}

        </table>

        <hr>

        <h4>Total: ₹{{ total }}</h4>

        <a href="/checkout" class="btn btn-success w-100 mt-2">
            Proceed to Checkout
        </a>

        <a href="/shop" class="btn btn-secondary w-100 mt-2">
            Continue Shopping
        </a>

    </div>

</div>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #e9f7ef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .check {
            font-size: 60px;
            color: #28a745;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="check">✔️</div>

    <h2>Order Placed Successfully!</h2>

    <p>Thank you for shopping with us.</p>

    <a href="/shop" class="btn btn-primary mt-3">
        Back to Shop
    </a>

</div>

</body>
</html>
